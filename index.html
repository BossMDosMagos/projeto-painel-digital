<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Velocímetro GPS Moto</title>
  
  <!-- CONFIGURAÇÕES PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velocímetro">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- DIALOG / PAINEL DE CONFIGURAÇÕES COMPLETO (Aparece ao segurar o dedo fora do painel) -->
  <dialog class="config-modal" id="config-modal">
    <div class="config-content">
      <h2>Configurações do Painel</h2>

      <div class="config-group">
        <label for="cfg-total-odo">Calibrar Odômetro Real (km):</label>
        <div class="input-inline">
          <input type="number" id="cfg-total-odo" step="0.1" min="0" inputmode="decimal">
          <button id="btn-save-odo" class="btn-action">Salvar</button>
        </div>
      </div>

      <div class="config-group">
        <label>Odômetro Parcial (Trip):</label>
        <button id="btn-reset-trip" class="btn-danger">Zerar Trip</button>
      </div>

      <div class="config-group">
        <label for="cfg-oil-interval">Intervalo Troca de Óleo (km):</label>
        <div class="input-inline">
          <input type="number" id="cfg-oil-interval" step="100" min="500" inputmode="numeric">
          <button id="btn-save-oil" class="btn-action">Salvar</button>
        </div>
        <p class="oil-summary" id="oil-summary"></p>
      </div>

      <div class="config-group">
        <label for="cfg-oil-last">Última Troca de Óleo (km no odômetro):</label>
        <div class="input-inline">
          <input type="number" id="cfg-oil-last" step="0.1" min="0" inputmode="decimal">
          <button id="btn-save-oil-last" class="btn-action">Salvar</button>
        </div>
      </div>

      <div class="config-group">
        <label>Trocar óleo agora (registra no odômetro atual):</label>
        <button id="btn-oil-change" class="btn-action">Registrar Troca de Óleo</button>
      </div>

      <div class="config-group">
        <label for="cfg-volume">Volume do Aviso de Óleo: <span id="cfg-volume-label">45%</span></label>
        <div class="input-inline">
          <input type="range" id="cfg-volume" min="0" max="100" step="5" value="45">
          <button id="btn-test-sound" class="btn-action">Testar Som</button>
        </div>
      </div>

      <div class="config-group">
        <label>Modo Noturno (Cores Customizadas):</label>
        <div class="color-pickers">
          <label>
            Traços:
            <input type="color" id="picker-ticks" value="#ff3333">
          </label>
          <label>
            Números:
            <input type="color" id="picker-numbers" value="#ff6666">
          </label>
        </div>
      </div>

      <div class="config-group">
        <label>Alternar Modo Noturno:</label>
        <button id="btn-toggle-night" class="btn-action">Alternar Dia/Noite</button>
      </div>

      <div class="config-group">
        <label>Navegação Dividida (50/50):</label>
        <button id="btn-toggle-nav" class="btn-action">Abrir modo dividido</button>
      </div>

      <button id="btn-close-config" class="btn-close">Fechar</button>
    </div>
  </dialog>

  <!-- TOAST (feedback não-bloqueante) -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <main class="panel-row">

  <div class="gauge-container" id="gauge-card">
    <svg viewBox="0 0 400 400" class="gauge-svg">
      <defs>
        <radialGradient id="dial-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="85%" stop-color="#f1f3f5"/>
          <stop offset="100%" stop-color="#dbe2e6"/>
        </radialGradient>

        <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#343a40"/>
          <stop offset="50%" stop-color="#121416"/>
          <stop offset="100%" stop-color="#000000"/>
        </linearGradient>

        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-opacity="0.4"/>
        </filter>

        <filter id="led-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <clipPath id="odo-digit-clip">
          <rect x="0" y="0" width="18" height="22" rx="2"/>
        </clipPath>
        <clipPath id="odo-dec-clip">
          <rect x="0" y="0" width="20" height="22" rx="2"/>
        </clipPath>
      </defs>

      <!-- Aro Externo -->
      <circle cx="200" cy="200" r="195" fill="url(#bezel-grad)"/>
      <circle cx="200" cy="200" r="182" fill="#0d0e10"/>
      
      <!-- Fundo do Mostrador -->
      <circle cx="200" cy="200" r="176" fill="url(#dial-grad)" id="dial-face"/>

      <!-- Marcas e Números -->
      <g id="ticks"></g>
      <g id="numbers"></g>

      <!-- LED DE STATUS DO GPS -->
      <g id="gps-led-group" class="gps-led-off" transform="translate(200, 118)">
        <circle cx="0" cy="0" r="6" fill="#121416" stroke="#212529" stroke-width="1.2"/>
        <circle id="gps-led-dot" cx="0" cy="0" r="4" class="gps-dot"/>
        <text x="0" y="-9" class="gps-label">GPS</text>
      </g>

      <!-- ODÔMETRO TOTAL -->
      <g transform="translate(136, 138)" id="total-odo-btn" style="cursor: pointer;">
        <rect x="0" y="0" width="128" height="28" rx="3" fill="#0d0e10" stroke="#212529" stroke-width="2"/>
        
        <g transform="translate(4, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-total-5" class="odo-strip"></g>
        </g>
        <g transform="translate(24, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-total-4" class="odo-strip"></g>
        </g>
        <g transform="translate(44, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-total-3" class="odo-strip"></g>
        </g>
        <g transform="translate(64, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-total-2" class="odo-strip"></g>
        </g>
        <g transform="translate(84, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-total-1" class="odo-strip"></g>
        </g>
        <g transform="translate(104, 3)" clip-path="url(#odo-dec-clip)">
          <rect x="0" y="0" width="20" height="22" fill="#e9ecef"/>
          <g id="odo-total-0" class="odo-strip-dec"></g>
        </g>
      </g>

      <!-- PARCIAL / TRIP -->
      <g transform="translate(156, 232)" id="trip-btn" style="cursor: pointer;">
        <rect x="0" y="0" width="88" height="28" rx="3" fill="#0d0e10" stroke="#212529" stroke-width="2"/>
        
        <g transform="translate(4, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-trip-3" class="odo-strip"></g>
        </g>
        <g transform="translate(24, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-trip-2" class="odo-strip"></g>
        </g>
        <g transform="translate(44, 3)" clip-path="url(#odo-digit-clip)">
          <rect x="0" y="0" width="18" height="22" fill="#181a1d"/>
          <g id="odo-trip-1" class="odo-strip"></g>
        </g>
        <g transform="translate(64, 3)" clip-path="url(#odo-dec-clip)">
          <rect x="0" y="0" width="20" height="22" fill="#e9ecef"/>
          <g id="odo-trip-0" class="odo-strip-dec"></g>
        </g>
      </g>

      <!-- UNIDADE KM/H -->
      <text x="200" y="288" class="unit-text">km/h</text>

      <!-- PARAFUSOS DE FIXAÇÃO -->
      <g fill="#212529">
        <circle cx="160" cy="210" r="5" fill="#2b3035" stroke="#121416" stroke-width="1"/>
        <line x1="157" y1="210" x2="163" y2="210" stroke="#868e96" stroke-width="1.2"/>
        <line x1="160" y1="207" x2="160" y2="213" stroke="#868e96" stroke-width="1.2"/>

        <circle cx="240" cy="210" r="5" fill="#2b3035" stroke="#121416" stroke-width="1"/>
        <line x1="237" y1="210" x2="243" y2="210" stroke="#868e96" stroke-width="1.2"/>
        <line x1="240" y1="207" x2="240" y2="213" stroke="#868e96" stroke-width="1.2"/>
      </g>

      <!-- PONTEIRO EIXADO EM (200, 200) -->
      <g id="needle-group" style="transform-origin: 200px 200px;">
        <line x1="200" y1="200" x2="60" y2="200" stroke="rgba(0,0,0,0.3)" stroke-width="5" stroke-linecap="round" transform="translate(2, 5)"/>
        <line x1="200" y1="200" x2="60" y2="200" class="needle-body"/>
        <line x1="200" y1="200" x2="62" y2="200" class="needle-core"/>

        <circle cx="200" cy="200" r="22" fill="#0d0e10" filter="url(#drop-shadow)"/>
        <circle cx="200" cy="200" r="20" fill="url(#bezel-grad)"/>
        <circle cx="200" cy="200" r="11" fill="#181a1d"/>
      </g>
    </svg>

    <!-- RELÓGIO LCD 24H (embutido na chapa branca, abaixo de km/h) -->
    <div class="clock-display" id="clock-wrap" aria-label="Relógio">
      <div class="time-wrapper">
        <span class="digit" id="h1">0</span>
        <span class="digit" id="h2">0</span>
        <span class="colon">:</span>
        <span class="digit" id="m1">0</span>
        <span class="digit" id="m2">0</span>
        <span class="colon-sec">:</span>
        <span class="digit-sec" id="s1">0</span>
        <span class="digit-sec" id="s2">0</span>
      </div>
      <div class="oil-message" id="oil-message" aria-label="Troca de óleo">
        <svg class="oil-wrench" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
        </svg>
        <span class="oil-label">ÓLEO</span>
      </div>
    </div>
  </div>

  <!-- PAINEL DE NAVEGAÇÃO TURN-BY-TURN (lado direito no modo dividido 50/50) -->
  <div class="nav-panel" id="nav-panel" aria-label="Navegação">
    <div class="nav-header">
      <span id="nav-title">DESTINO</span>
    </div>

    <div class="nav-arrow-box">
      <svg class="nav-arrow" id="nav-arrow" viewBox="0 0 64 64" aria-hidden="true">
        <path id="nav-arrow-main" d="M32 6 L50 54 L32 44 L14 54 Z"/>
        <g id="nav-arrow-roundabout" style="display:none">
          <path d="M32 32 m-18 0 a18 18 0 1 1 36 0 a18 18 0 1 1 -36 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          <path d="M32 14 L40 30 L32 26 L24 30 Z"/>
        </g>
        <g id="nav-arrive" style="display:none">
          <path d="M18 52 L22 28 L46 28 L50 52 Z"/>
          <rect x="28" y="6" width="8" height="16" rx="2"/>
        </g>
      </svg>
    </div>

    <div class="nav-distance">
      <span id="nav-dist-value">—</span><span class="nav-dist-unit" id="nav-dist-unit"></span>
    </div>

    <div class="nav-street" id="nav-street">Sem rota ativa</div>
  </div>

  </main>

  <script src="main.js"></script>
  
  <!-- REGISTRO DO SERVICE WORKER DO PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado!', reg))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
