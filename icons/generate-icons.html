<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Ícones PWA</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; }
        h1 { color: #27ae60; }
        .btn { background: #27ae60; color: white; border: none; padding: 12px 24px; margin: 5px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #2ecc71; }
        .size { display: inline-block; margin: 5px; padding: 10px; background: #222; border-radius: 4px; }
        canvas { border: 1px solid #333; background: #D1D6D3; }
        .log { margin-top: 20px; padding: 10px; background: #0d0d0d; color: #0f0; font-size: 0.85rem; max-height: 300px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🎨 Gerador de Ícones PWA - Painel Digital GPS</h1>
    <p>Gera todos os tamanhos necessários para manifest.json</p>
    
    <button class="btn" onclick="generateAll()">Gerar Todos os Ícones</button>
    <button class="btn" onclick="downloadAll()">Baixar Todos (ZIP)</button>
    
    <div id="preview"></div>
    <div class="log" id="log"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const generated = {};

        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += msg + '\n';
            el.scrollTop = el.scrollHeight;
        }

        function drawIcon(ctx, size) {
            const padding = size * 0.125;
            const innerSize = size - padding * 2;
            
            // Background LCD gray
            ctx.fillStyle = '#D1D6D3';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.125);
            ctx.fill();
            
            // Inner dark screen
            ctx.fillStyle = '#1A1A2E';
            ctx.beginPath();
            ctx.roundRect(padding, padding, innerSize, innerSize, size * 0.0625);
            ctx.fill();
            
            // Speed digits "88"
            ctx.font = `bold ${size * 0.23}px 'Orbitron', monospace`;
            ctx.fillStyle = '#0D0D0D';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('88', size / 2, size * 0.42);
            
            // KM/H label
            ctx.font = `bold ${size * 0.09}px 'Space Mono', monospace`;
            ctx.fillStyle = '#3D3D3D';
            ctx.fillText('KM/H', size / 2, size * 0.62);
            
            // Reset button (red)
            const btnW = size * 0.27;
            const btnH = size * 0.078;
            const btnY = size * 0.74;
            
            ctx.fillStyle = '#C0392B';
            ctx.beginPath();
            ctx.roundRect(size * 0.195, btnY, btnW, btnH, size * 0.015);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.039}px 'Space Mono', monospace`;
            ctx.fillText('RESET', size * 0.33, btnY + btnH * 0.65);
            
            // Calibrate button (green)
            ctx.fillStyle = '#27AE60';
            ctx.beginPath();
            ctx.roundRect(size * 0.53, btnY, btnW, btnH, size * 0.015);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.fillText('AJUSTAR', size * 0.665, btnY + btnH * 0.65);
        }

        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Enable high quality
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            
            drawIcon(ctx, size);
            
            const dataUrl = canvas.toDataURL('image/png');
            generated[size] = dataUrl;
            
            // Preview
            const wrapper = document.createElement('div');
            wrapper.className = 'size';
            wrapper.innerHTML = `<canvas width="${size}" height="${size}"></canvas><div>${size}x${size}</div>`;
            wrapper.querySelector('canvas').getContext('2d').drawImage(canvas, 0, 0);
            document.getElementById('preview').appendChild(wrapper);
            
            log(`✅ Gerado: ${size}x${size}px`);
            return dataUrl;
        }

        function generateAll() {
            document.getElementById('preview').innerHTML = '';
            document.getElementById('log').textContent = '';
            
            sizes.forEach(size => generateIcon(size));
            
            log('\n🎉 Todos os ícones gerados! Clique em "Baixar Todos" para salvar.');
        }

        function downloadAll() {
            if (Object.keys(generated).length === 0) {
                alert('Gere os ícones primeiro!');
                return;
            }
            
            sizes.forEach(size => {
                const a = document.createElement('a');
                a.href = generated[size];
                a.download = `icon-${size}.png`;
                a.click();
            });
            
            log('\n📥 Download iniciado para todos os tamanhos.');
            log('💡 Mova os arquivos para a pasta icons/ e renomeie se necessário.');
        }

        // Auto-generate on load
        window.onload = () => {
            // Load fonts first
            document.fonts.load('1em "Orbitron"').then(() => {
                document.fonts.load('1em "Space Mono"').then(() => {
                    generateAll();
                });
            });
        };
    </script>
</body>
</html>
